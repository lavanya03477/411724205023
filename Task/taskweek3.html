<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Message Manager</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <h2>Message Manager</h2>

    <input type="text" id="messageInput" placeholder="Enter Message">
    <button id="addBtn">Add Message</button>
    <button id="clearBtn">Clear All Messages</button>

    <p>Character Count: <span id="count">0</span></p>

    <h3>Messages</h3>
    <div id="messages"></div>

    <p id="status"></p>

    <script src="script3.js"></script>

</body>
</html>
